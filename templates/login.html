{% extends "base.html" %}
{% block content %}
<div class="loginbox">
  <h1>{{ L('Вход','Kirish') }}</h1>
  <p class="muted">{{ L('Для учителей, родителей и администрации. Логин и пароль выдаёт школа.','O‘qituvchilar, ota-onalar va ma’muriyat uchun. Login va parolni maktab beradi.') }}</p>
  <form method="post" class="grid">{{ tok() }}
    <div><label for="u">{{ L('Логин','Login') }}</label><input id="u" name="username" autocomplete="username" required autofocus></div>
    <div><label for="p">{{ L('Пароль','Parol') }}</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">{{ L('Войти','Kirish') }}</button>
  </form>
</div>
{% endblock %}
