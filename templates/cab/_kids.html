<div class="kids no-print">{% for k in kids %}<a href="{{ url_for(request.endpoint, c=k.id) }}" class="{{ 'on' if k.id==st.id }}"><span class="avatar">{% if k.photo_id %}<img src="{{ url_for('auth.file', fid=k.photo_id) }}" alt="">{% else %}{{ k.full_name[:1] }}{% endif %}</span><span>{{ k.full_name.split()[0:2]|join(' ') }}<br><span class="muted small">{{ k.klass.name if k.klass else '—' }}</span></span></a>{% endfor %}</div>
